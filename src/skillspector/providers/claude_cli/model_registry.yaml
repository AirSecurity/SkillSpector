# Marketplace addition (air/space) — NOT part of upstream NVIDIA SkillSpector.
#
# Token-budget metadata for the claude_cli provider (Claude Code CLI, OAuth).
# The CLI accepts the sonnet/opus/haiku aliases; these entries are only used
# for token-budget lookups (chunking).
models:
  "claude-sonnet-4-6":
    context_length: 1000000
    max_output_tokens: 128000
  "claude-opus-4-6":
    context_length: 1000000
    max_output_tokens: 128000
  "sonnet":
    context_length: 1000000
    max_output_tokens: 128000
  "opus":
    context_length: 1000000
    max_output_tokens: 128000
  "haiku":
    context_length: 200000
    max_output_tokens: 64000
